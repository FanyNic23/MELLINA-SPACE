<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A-HAMS | Asistente Smartwatch</title>
  <style>
    :root {
      --bg: #070b14;
      --card: #121d33;
      --card-2: #0e1726;
      --border: #1f2e4d;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --cyan: #00f2fe;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --status: var(--emerald);
      --watch: min(84vw, 380px);
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 30% 20%, #0e1a30 0%, var(--bg) 60%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      background: rgba(14, 23, 38, 0.8);
    }
    header a { color: var(--cyan); text-decoration: none; font-size: 13px; font-family: var(--mono); }
    header h1 { margin: 0; font-size: 14px; letter-spacing: 0.08em; font-weight: 700; }
    header h1 span { color: var(--cyan); }
    .link-badge {
      font-family: var(--mono); font-size: 11px; padding: 4px 8px; border-radius: 6px;
      border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
    }
    .link-badge.online { color: var(--emerald); border-color: rgba(16, 185, 129, 0.4); }
    .link-badge.offline { color: var(--amber); border-color: rgba(245, 158, 11, 0.4); }

    main {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      gap: 40px; padding: 32px 16px 48px; max-width: 1100px; margin: 0 auto;
    }

    /* ── Reloj ─────────────────────────────────────────────── */
    .watch { position: relative; width: var(--watch); flex: none; }
    .strap {
      width: 52%; height: calc(var(--watch) * 0.22); margin: 0 auto;
      background: linear-gradient(90deg, #0b1220, #18233a 50%, #0b1220);
      border: 1px solid #1a2740;
    }
    .strap.top { border-radius: 14px 14px 4px 4px; border-bottom: none; }
    .strap.bottom { border-radius: 4px 4px 14px 14px; border-top: none; }
    .case {
      position: relative; width: var(--watch); aspect-ratio: 1; border-radius: 50%;
      background: linear-gradient(145deg, #2a3a57, #0b1322 55%, #1d2a42);
      padding: calc(var(--watch) * 0.045);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }
    .crown {
      position: absolute; right: calc(var(--watch) * -0.035); top: 42%;
      width: calc(var(--watch) * 0.05); height: 16%; border-radius: 4px;
      background: linear-gradient(90deg, #2a3a57, #121c2e); border: 1px solid #33466a;
    }
    .ring { position: absolute; inset: calc(var(--watch) * 0.018); pointer-events: none; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 2.6; }
    .ring .track { stroke: rgba(148, 163, 184, 0.15); }
    .ring .value { stroke: var(--status); stroke-linecap: round; transition: stroke-dasharray 0.8s ease, stroke 0.4s; }

    .screen {
      position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
      background: radial-gradient(circle at 50% 38%, #08243a 0%, #030710 70%);
      box-shadow: inset 0 0 30px rgba(0, 242, 254, 0.12);
      cursor: pointer;
    }
    .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .hud {
      position: absolute; left: 0; right: 0; text-align: center; pointer-events: none;
      font-family: var(--mono);
    }
    .hud.time { top: 7%; font-size: calc(var(--watch) * 0.05); font-weight: 700; letter-spacing: 0.06em; }
    .hud.time small { display: block; font-size: 0.52em; color: var(--muted); font-weight: 500; letter-spacing: 0.14em; }
    .hud.crew { top: 19%; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: calc(var(--watch) * 0.03); padding: 3px 8px; border-radius: 999px;
      background: rgba(7, 11, 20, 0.7); border: 1px solid var(--status); color: var(--status);
    }
    .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--status); }
    .caption {
      position: absolute; left: 14%; right: 14%; bottom: 21%; min-height: 2.8em;
      font-size: calc(var(--watch) * 0.036); line-height: 1.35; text-align: center;
      color: #e0fbff; text-shadow: 0 1px 6px #000; pointer-events: none;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .caption::before {
      content: ""; position: absolute; inset: -10px -14px; z-index: -1; border-radius: 12px;
      background: rgba(3, 7, 16, 0.55);
    }
    .caption:empty::before { display: none; }
    .mic {
      position: absolute; left: 50%; bottom: 5.5%; transform: translateX(-50%);
      width: calc(var(--watch) * 0.13); height: calc(var(--watch) * 0.13); border-radius: 50%;
      border: 1px solid rgba(0, 242, 254, 0.5); background: rgba(0, 242, 254, 0.12);
      display: grid; place-items: center; transition: background 0.2s, box-shadow 0.2s;
    }
    .mic svg { width: 45%; height: 45%; fill: var(--cyan); }
    .mic.listening { background: rgba(244, 63, 94, 0.25); border-color: var(--rose); box-shadow: 0 0 0 6px rgba(244, 63, 94, 0.15); }
    .mic.listening svg { fill: var(--rose); }
    .mic.speaking { box-shadow: 0 0 0 6px rgba(0, 242, 254, 0.12); }
    .mic:disabled { opacity: 0.35; cursor: not-allowed; }
    .webgl-error { position: absolute; inset: 30% 15%; text-align: center; color: var(--muted); font-size: 13px; }

    /* ── Panel de control ──────────────────────────────────── */
    .panel {
      width: min(100%, 440px); min-width: 0; background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px; display: grid; gap: 18px;
    }
    .panel h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.14em; color: var(--muted); font-family: var(--mono); font-weight: 600; }
    .crew-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .crew-btn {
      text-align: left; padding: 9px 10px; border-radius: 9px; background: var(--card-2);
      border: 1px solid var(--border); display: grid; gap: 2px; font-size: 13px;
    }
    .crew-btn small { color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; gap: 6px; }
    .crew-btn small b { font-family: var(--mono); }
    .crew-btn[aria-pressed="true"] { border-color: var(--cyan); background: rgba(0, 242, 254, 0.07); }
    .actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .action {
      padding: 11px 10px; border-radius: 9px; border: 1px solid rgba(0, 242, 254, 0.35);
      background: rgba(0, 242, 254, 0.08); color: #a5f3fc; font-weight: 600; font-size: 13px;
    }
    .action:hover { background: rgba(0, 242, 254, 0.16); }
    .action.wide { grid-column: span 2; }
    .action.stop { border-color: var(--border); background: transparent; color: var(--muted); }
    .row { display: flex; gap: 8px; align-items: center; }
    select {
      flex: 1; min-width: 0; padding: 8px; border-radius: 8px; background: var(--card-2); color: var(--text);
      border: 1px solid var(--border); font-size: 13px;
    }
    .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; line-height: 1.45; }
    .log { max-height: 220px; overflow-y: auto; display: grid; gap: 8px; font-size: 13px; line-height: 1.45; }
    .log p { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--card-2); }
    .log p b { font-family: var(--mono); font-size: 11px; display: block; margin-bottom: 2px; color: var(--cyan); }
    .log p.user b { color: var(--amber); }
    @media (max-width: 520px) {
      header { flex-wrap: wrap; }
      header h1 { order: 3; width: 100%; font-size: 12px; }
      main { padding-top: 20px; gap: 24px; }
      .panel { padding: 14px; }
    }
    .log:empty::after { content: attr(data-empty); color: var(--muted); font-size: 12px; }
    .lang-switch { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex: none; }
    .lang-switch button {
      border: none; background: var(--card-2); padding: 8px 12px; font-size: 12px;
      font-family: var(--mono); font-weight: 700; color: var(--muted);
    }
    .lang-switch button[aria-pressed="true"] { background: rgba(0, 242, 254, 0.15); color: var(--cyan); }
  </style>
</head>
<body>
  <header>
    <a href="smartwatch.html" data-i18n="back">← Reloj</a>
    <h1><span>A-HAMS</span> · <span data-i18n="title" style="color: inherit">ASISTENTE DE RELOJ</span></h1>
    <span class="link-badge" id="link-badge">CONECTANDO…</span>
  </header>

  <main id="stage">
    <div class="watch">
      <div class="strap top"></div>
      <div class="case">
        <div class="crown"></div>
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="track" cx="50" cy="50" r="48.5"></circle>
          <circle class="value" id="sews-ring" cx="50" cy="50" r="48.5" stroke-dasharray="0 400"></circle>
        </svg>
        <div class="screen" id="screen" role="button" tabindex="0" data-i18n-aria="screenAria" aria-label="Hablar con el asistente">
          <canvas id="avatar"></canvas>
          <div class="hud time"><span id="clock">--:--</span><small id="sol">SOL ---</small></div>
          <div class="hud crew"><span class="chip"><i></i><span id="chip-text">—</span></span></div>
          <div class="caption" id="caption" aria-live="polite"></div>
          <button class="mic" id="mic" data-i18n-aria="micAria" aria-label="Hablar por micrófono">
            <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
          </button>
        </div>
      </div>
      <div class="strap bottom"></div>
    </div>

    <section class="panel" data-i18n-aria="panelAria" aria-label="Controles del asistente">
      <div>
        <h2 data-i18n="crew">TRIPULANTE</h2>
        <div class="crew-list" id="crew-list"></div>
      </div>
      <div>
        <h2 data-i18n="queries">CONSULTAS</h2>
        <div class="actions">
          <button class="action" data-topic="health" data-i18n="health">Salud</button>
          <button class="action" data-topic="ship" data-i18n="ship">Nave</button>
          <button class="action" data-topic="environment" data-i18n="environment">Ambiente</button>
          <button class="action" data-topic="full" data-i18n="full">Diagnóstico completo</button>
          <button class="action stop wide" id="stop" data-i18n="stop">Detener</button>
        </div>
      </div>
      <div>
        <h2 data-i18n="voice">IDIOMA Y VOZ</h2>
        <div class="row">
          <div class="lang-switch" role="group" aria-label="Idioma / Language">
            <button data-lang="es" aria-pressed="true">ES</button>
            <button data-lang="en" aria-pressed="false">EN</button>
          </div>
          <select id="voice-select" data-i18n-aria="voiceAria" aria-label="Voz del asistente"></select>
        </div>
        <p class="hint" id="voice-hint"></p>
        <p class="hint" id="stt-hint"></p>
        <p class="hint" id="ai-hint"></p>
      </div>
      <div>
        <h2 data-i18n="conversation">CONVERSACIÓN</h2>
        <div class="log" id="log" data-empty="Toca el reloj o elige una consulta."></div>
      </div>
    </section>
  </main>

  <script src="vendor/three.min.js"></script>
  <script src="assistant/config.js"></script>
  <script src="assistant/avatar3d.js"></script>
  <script src="assistant/voice.js"></script>
  <script src="assistant/listener.js"></script>
  <script src="assistant/diagnosis.js"></script>
  <script>
    (function () {
      'use strict';
      const D = window.MissionDiagnosis;
      const $ = (id) => document.getElementById(id);
      const STATUS_VAR = { NOMINAL: '--emerald', ALERTA_MODERADA: '--amber', ALERTA_CRITICA: '--rose' };

      // ── Idioma de la interfaz (el diagnóstico hablado vive en diagnosis.js) ──
      const UI = {
        es: {
          back: '← Reloj', title: 'ASISTENTE DE RELOJ', crew: 'TRIPULANTE', queries: 'CONSULTAS',
          health: 'Salud', ship: 'Nave', environment: 'Ambiente', full: 'Diagnóstico completo', stop: 'Detener',
          voice: 'IDIOMA Y VOZ', conversation: 'CONVERSACIÓN', logEmpty: 'Toca el reloj o elige una consulta.',
          screenAria: 'Hablar con el asistente', micAria: 'Hablar por micrófono', panelAria: 'Controles del asistente', voiceAria: 'Voz del asistente',
          aiOnline: 'EDGE CORE · IA EN LÍNEA', aiOffline: 'EDGE CORE · IA OFFLINE', standalone: 'MODO AUTÓNOMO', connecting: 'CONECTANDO…',
          aiHintOnline: (m) => `IA: en línea (${m}). Responde cualquier pregunta con todos los datos de la misión.`,
          aiHintOffline: 'IA: offline. Respuestas locales de salud, nave y ambiente; sin internet.',
          aiTag: ' · IA',
          tapToTalk: (n) => `Toca para hablar con ${n}`, listening: 'Te escucho…', processing: 'Procesando…',
          notHeard: 'No te escuché. Toca el micrófono e inténtalo de nuevo.',
          micPermission: 'Necesito permiso para usar el micrófono.', micError: 'No pude procesar tu voz.',
          you: 'TÚ', online_voice: ' · en línea',
          ttsModel: 'Voz: síntesis del Edge Core (ElevenLabs, requiere internet). Si falla, usa la voz del sistema.',
          ttsBrowser: 'Voz: del sistema. Configura ELEVENLABS_API_KEY en backend/.env para usar la voz del Edge Core.',
          noVoices: 'No hay voces en español instaladas en este sistema.',
          sttServer: (s) => s.offline
            ? `Micrófono: Whisper local (${s.model}) en el Edge Core, sin internet.`
            : `Micrófono: ${s.provider} (${s.model}) vía el Edge Core; requiere internet.`,
          sttBrowser: 'Micrófono: reconocimiento del navegador (requiere internet). Inicia el Edge Core para usar Whisper local.',
          sttNone: 'Micrófono: no disponible en este navegador.',
          micUnavailable: 'No hay reconocimiento de voz disponible. Usa las consultas del panel.',
          roles: {},
        },
        en: {
          back: '← Watch', title: 'WATCH ASSISTANT', crew: 'CREW MEMBER', queries: 'QUERIES',
          health: 'Health', ship: 'Ship', environment: 'Environment', full: 'Full diagnosis', stop: 'Stop',
          voice: 'LANGUAGE & VOICE', conversation: 'CONVERSATION', logEmpty: 'Tap the watch or pick a query.',
          screenAria: 'Talk to the assistant', micAria: 'Speak through the microphone', panelAria: 'Assistant controls', voiceAria: 'Assistant voice',
          aiOnline: 'EDGE CORE · AI ONLINE', aiOffline: 'EDGE CORE · AI OFFLINE', standalone: 'STANDALONE MODE', connecting: 'CONNECTING…',
          aiHintOnline: (m) => `AI: online (${m}). Answers any question with all mission data.`,
          aiHintOffline: 'AI: offline. Local health, ship and environment answers; no internet needed.',
          aiTag: ' · AI',
          tapToTalk: (n) => `Tap to talk to ${n}`, listening: "I'm listening…", processing: 'Processing…',
          notHeard: "I didn't hear you. Tap the microphone and try again.",
          micPermission: 'I need permission to use the microphone.', micError: "I couldn't process your voice.",
          you: 'YOU', online_voice: ' · online',
          ttsModel: 'Voice: Edge Core synthesis (ElevenLabs, needs internet). Falls back to the system voice.',
          ttsBrowser: 'Voice: system voice. Set ELEVENLABS_API_KEY in backend/.env to use the Edge Core voice.',
          noVoices: 'No English voices are installed on this system.',
          sttServer: (s) => s.offline
            ? `Microphone: local Whisper (${s.model}) on the Edge Core, no internet needed.`
            : `Microphone: ${s.provider} (${s.model}) through the Edge Core; needs internet.`,
          sttBrowser: 'Microphone: browser speech recognition (needs internet). Start the Edge Core to use local Whisper.',
          sttNone: 'Microphone: not available in this browser.',
          micUnavailable: 'No speech recognition available. Use the panel queries.',
          roles: {
            'Comandante de Misión': 'Mission Commander', 'Ingeniero de Vuelo': 'Flight Engineer',
            'Oficial Científico': 'Science Officer', 'Especialista Médica': 'Medical Specialist',
          },
        },
      };
      let lang = 'es';
      const t = (key) => UI[lang][key];

      // ── Avatar ────────────────────────────────────────────────
      let avatar;
      try {
        avatar = new HoloAvatar($('avatar'));
      } catch (err) {
        console.error(err);
        $('screen').insertAdjacentHTML('beforeend', '<div class="webgl-error">WebGL no disponible en este dispositivo.</div>');
        avatar = { setMouth() {}, setMode() {}, lookAt() {}, setStatus() {} };
      }

      // ── Voz ───────────────────────────────────────────────────
      const mic = $('mic');
      const voice = new VoiceEngine({
        onMouth: (open, width) => avatar.setMouth(open, width),
        onSentence: (s) => { $('caption').textContent = s; },
        onState: (state) => {
          avatar.setMode(state);
          mic.classList.toggle('speaking', state === 'speaking');
          if (state === 'idle') setTimeout(() => { if (!speaking() && !listener.busy) $('caption').textContent = ''; }, 2500);
        },
      });
      const speaking = () => mic.classList.contains('speaking');

      function fillVoices() {
        const sel = $('voice-select');
        const voices = voice.voices;
        sel.innerHTML = '';
        for (const v of voices) {
          const opt = new Option(`${v.name} (${v.lang})${v.localService ? '' : t('online_voice')}`, v.name);
          opt.selected = voice.voice && v.name === voice.voice.name;
          sel.add(opt);
        }
        sel.disabled = !voices.length;
        $('voice-hint').textContent = VOICE_CONFIG.engine === 'model'
          ? t('ttsModel')
          : voices.length ? t('ttsBrowser') : t('noVoices');
      }
      fillVoices();
      if (voice.supported) speechSynthesis.addEventListener('voiceschanged', fillVoices);
      $('voice-select').addEventListener('change', (e) => voice.setVoice(e.target.value));

      // ── Estado de misión ──────────────────────────────────────
      let mission = { crew: [], dtn: null, online: false };
      let current = null;
      let aiOnline = false;
      const conversation = [];  // últimos turnos, para que la IA en línea tenga memoria de la charla
      const MAX_TURNS = 6;

      function log(who, text, cls) {
        const p = document.createElement('p');
        if (cls) p.className = cls;
        p.innerHTML = '<b></b>';
        p.firstChild.textContent = who;
        p.append(text);
        $('log').prepend(p);
      }

      function say(text, fromAI) {
        log(D.ASSISTANT_NAME.toUpperCase() + (fromAI ? t('aiTag') : ''), text);
        return voice.speak(text);
      }

      function renderBadge() {
        const badge = $('link-badge');
        const state = !mission.online ? 'standalone' : aiOnline ? 'aiOnline' : 'aiOffline';
        badge.textContent = t(state);
        badge.dataset.state = state;
        badge.className = 'link-badge ' + (mission.online ? 'online' : 'offline');
      }

      function renderCrew() {
        const list = $('crew-list');
        list.innerHTML = '';
        for (const m of mission.crew) {
          const b = document.createElement('button');
          b.className = 'crew-btn';
          b.setAttribute('aria-pressed', String(current && m.id === current.id));
          b.innerHTML = '<span></span><small><span></span><b></b></small>';
          b.children[0].textContent = m.name;
          b.querySelector('small span').textContent = t('roles')[m.role] || m.role;
          const sews = b.querySelector('small b');
          sews.textContent = `SEWS ${String(m.sews).padStart(2, '0')}`;
          sews.style.color = `var(${STATUS_VAR[m.displayStatus] || '--muted'})`;
          b.addEventListener('click', () => select(m, true));
          list.append(b);
        }
      }

      function select(m, announce) {
        current = m;
        document.documentElement.style.setProperty('--status', `var(${STATUS_VAR[m.displayStatus] || '--cyan'})`);
        const circ = 2 * Math.PI * 48.5;
        $('sews-ring').setAttribute('stroke-dasharray', `${(Math.max(m.sews, 0.3) / 15) * circ} ${circ}`);
        $('chip-text').textContent = `${m.name.replace(/^Dra?\.\s*/, '').split(' ').pop().toUpperCase()} · SEWS ${String(m.sews).padStart(2, '0')}`;
        $('sol').textContent = `SOL ${String(m.missionDay).padStart(3, '0')}`;
        avatar.setStatus(m.displayStatus);
        renderCrew();
        const url = new URL(location.href);
        url.searchParams.set('crew', m.id);
        history.replaceState(null, '', url);
        if (announce) say(D.greeting(m));
      }

      async function refresh() {
        mission = await D.loadMissionData();
        renderBadge();
        const wanted = (current && current.id) || new URLSearchParams(location.search).get('crew');
        select(mission.crew.find((m) => m.id === wanted) || mission.crew[0], false);
      }

      /** En línea responde la IA (cualquier pregunta); offline, o si la IA falla, las respuestas locales. */
      async function answer(topic, member, question) {
        if (member && member !== current) select(member, false);
        if (!current) return;
        if (topic === 'stop') return voice.stop();
        avatar.setMode('thinking');
        await refresh();
        const history = conversation.slice(-MAX_TURNS);
        const reply = aiOnline && (question || topic !== 'greeting')
          ? await D.askOnline({ crewId: current.id, topic, question, history })
          : null;
        const texts = {
          greeting: () => D.greeting(current),
          health: () => D.health(current),
          environment: () => D.environment(current),
          ship: () => D.ship(current, mission.dtn),
          full: () => D.full(current, mission.dtn),
        };
        const text = reply || (texts[topic] || D.unknown)();
        conversation.push({ role: 'user', text: question || t(topic) || topic }, { role: 'assistant', text });
        conversation.splice(0, Math.max(0, conversation.length - MAX_TURNS));
        return say(text, Boolean(reply));
      }

      document.querySelectorAll('[data-topic]').forEach((b) =>
        b.addEventListener('click', () => answer(b.dataset.topic)));
      $('stop').addEventListener('click', () => voice.stop());

      let greeted = false;
      function tapScreen(e) {
        if (e.target.closest('.mic')) return;
        if (speaking()) return voice.stop();
        answer(greeted ? 'health' : 'greeting');
        greeted = true;
      }
      $('screen').addEventListener('click', tapScreen);
      $('screen').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapScreen(e); }
      });

      // ── Reconocimiento de voz (entrada) ───────────────────────
      const listener = new VoiceListener({
        onState: (state) => {
          mic.classList.toggle('listening', state === 'listening');
          if (state === 'listening') {
            avatar.setMode('listening');
            $('caption').textContent = t('listening');
          } else if (state === 'transcribing') {
            avatar.setMode('thinking');
            $('caption').textContent = t('processing');
          } else if (!speaking()) {
            avatar.setMode('idle');
          }
        },
      });

      async function setupListener() {
        const engine = await listener.init();
        const status = listener.voiceStatus || {};
        aiOnline = status.mode === 'online';
        voice.useServerVoice(Boolean(status.tts && status.tts.available));
        fillVoices();
        renderBadge();
        renderAiHint();
        mic.disabled = !engine;
        mic.title = engine ? '' : t('micUnavailable');
        renderSttHint();
        return engine;
      }

      mic.addEventListener('click', async () => {
        if (listener.busy) return listener.stop();
        voice.stop();
        if (listener.engine !== 'server') await setupListener();
        try {
          const said = await listener.listen();
          if (!said) {
            $('caption').textContent = t('notHeard');
            return;
          }
          log(t('you'), said, 'user');
          const intent = D.intentFrom(said, mission.crew);
          if (intent.type === 'select') select(intent.member, true);
          else if (intent.type === 'stop') voice.stop();
          else answer(intent.type, intent.member, said);  // la IA en línea recibe la pregunta tal cual
        } catch (err) {
          console.error('[micrófono]', err);
          $('caption').textContent = t(err.name === 'NotAllowedError' ? 'micPermission' : 'micError');
        }
      });
      function renderAiHint() {
        $('ai-hint').textContent = aiOnline
          ? t('aiHintOnline')((listener.voiceStatus.llm || {}).model) : t('aiHintOffline');
      }
      function renderSttHint() {
        $('stt-hint').textContent = listener.engine === 'server' ? t('sttServer')(listener.server)
          : listener.engine === 'browser' ? t('sttBrowser') : t('sttNone');
      }
      setupListener();
      // El modo cambia si se pierde o recupera internet: se revisa periódicamente (el backend lo cachea).
      setInterval(setupListener, 30000);

      // ── Cambio de idioma ──────────────────────────────────────
      function applyLanguage(code, announce) {
        if (!UI[code]) return;
        lang = code;
        document.documentElement.lang = code;
        D.setLanguage(code);
        voice.setLanguage(code);
        listener.setLanguage(code);
        document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
        document.querySelectorAll('[data-i18n-aria]').forEach((el) => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
        document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === code)));
        $('log').dataset.empty = t('logEmpty');
        const badge = $('link-badge');
        badge.textContent = t(badge.dataset.state || 'connecting');
        fillVoices();
        renderSttHint();
        renderAiHint();
        if (current) renderCrew();
        $('caption').textContent = t('tapToTalk')(D.ASSISTANT_NAME);
        try { localStorage.setItem('ahams-lang', code); } catch (err) { /* almacenamiento no disponible */ }
        const url = new URL(location.href);
        url.searchParams.set('lang', code);
        history.replaceState(null, '', url);
        if (announce && current) say(D.greeting(current));
      }
      document.querySelectorAll('[data-lang]').forEach((b) =>
        b.addEventListener('click', () => applyLanguage(b.dataset.lang, true)));

      // ── Mirada que sigue al puntero ───────────────────────────
      const screen = $('screen');
      $('stage').addEventListener('pointermove', (e) => {
        const r = screen.getBoundingClientRect();
        avatar.lookAt(((e.clientX - r.left) / r.width - 0.5) * 2, -((e.clientY - r.top) / r.height - 0.4) * 2);
      });
      $('stage').addEventListener('pointerleave', () => avatar.lookAt(0, 0));

      // ── Reloj ─────────────────────────────────────────────────
      const tick = () => {
        $('clock').textContent = new Date().toLocaleTimeString(lang, { hour: '2-digit', minute: '2-digit' });
      };
      tick();
      setInterval(tick, 10000);

      let savedLang = null;
      try { savedLang = localStorage.getItem('ahams-lang'); } catch (err) { /* almacenamiento no disponible */ }
      applyLanguage(new URLSearchParams(location.search).get('lang') || savedLang || 'es', false);

      refresh().then(() => {
        if (!$('caption').textContent) $('caption').textContent = t('tapToTalk')(D.ASSISTANT_NAME);
      });
    })();
  </script>
</body>
</html>
