# Render Blueprint · A-HAMS en producción (plan gratuito: 512 MB, 0.1 CPU; imagen del Dockerfile).
services:
  - type: web
    name: A-HAMS
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: WHISPER_CPU_THREADS   # con 0.1 CPU, un hilo y beam 1 transcriben ~4 veces más rápido
        value: "1"
      - key: WHISPER_BEAM_SIZE
        value: "1"
